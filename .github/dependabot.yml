version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    labels: ['dependencies']
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker'
    directories:
      - '/apps/admin'
      - '/apps/api'
      - '/apps/chat-bot'
      - '/services/calculator'
      - '/services/mock-llm'
    labels: ['dependencies']
    schedule:
      interval: 'weekly'
    ignore:
      # Ignore major version updates for Node.js (required to receive minor updates when staying on LTS)
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    groups:
      # Group safe, non-breaking bumps to reduce PRs
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker-compose'
    directories:
      - '/devops/docker'
    labels: ['dependencies']
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/'
    labels: ['dependencies']
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      #remark-docx uses currentyl 9.7.1 for docx, so we group them together here to ensure compatible updates
      remark-docx-docx:
        applies-to: version-updates
        patterns:
          - 'docx'
          - 'remark-docx'

      # Group safe, non-breaking bumps to reduce PRs; split by dependency-type
      # so each group's updater job has a smaller dependency graph to resolve
      # (the combined group was timing out on this large pnpm workspace).
      minor-and-patch-prod:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - 'minor'
          - 'patch'
      minor-and-patch-dev:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - 'minor'
          - 'patch'
