name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check_node_version_sync:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Verify Node version matches across .nvmrc, package.json and Dockerfiles
        run: |
          nvmrc_version=$(sed -E 's/^v//' .nvmrc | tr -d '[:space:]')
          engines_version=$(node -pe "require('./package.json').engines.node.replace(/^>=/, '')")

          if [ "$nvmrc_version" != "$engines_version" ]; then
            echo "::error::Node version mismatch: .nvmrc=$nvmrc_version, package.json engines.node=$engines_version"
            exit 1
          fi

          for dockerfile in $(find . -type f -name Dockerfile); do
            docker_version=$(grep -oP '(?<=^FROM node:)[0-9.]+' "$dockerfile" | head -n1)
            if [ -n "$docker_version" ] && [ "$docker_version" != "$nvmrc_version" ]; then
              echo "::error::Node version mismatch: .nvmrc=$nvmrc_version, $dockerfile=$docker_version"
              exit 1
            fi
          done

  install:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  check_formatting:
    runs-on: ubuntu-26.04
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check

  check_types:
    runs-on: ubuntu-26.04
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache turbo build cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-check-types-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-check-types-${{ runner.os }}-
      - name: Check types
        run: pnpm run check-types

  check_linter:
    runs-on: ubuntu-26.04
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache turbo build cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-
      - name: Check linter
        run: pnpm run lint

  check_migrations:
    runs-on: ubuntu-26.04
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check database migrations
        run: pnpm run db:check

  check_unit_tests:
    runs-on: ubuntu-26.04
    needs: install
    env:
      API_DATABASE_URL: postgresql://admin:test1234@localhost:5432/api_db
      API_KEY: random-key-for-testing-only

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test1234
          POSTGRES_DB: api_db
        options: >-
          --health-cmd "pg_isready -U admin -d api_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache turbo build cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-
      - name: Run api database migrations
        run: pnpm --filter @ais-chat/api-database run db:migrate
      - name: Check unit tests
        run: pnpm run test:coverage

      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/api/coverage/lcov.info,./apps/chat-bot/coverage/lcov.info,./packages/ai-core/coverage/lcov.info,./packages/shared/coverage/lcov.info,./packages/shared-core/coverage/lcov.info
