name: E2E Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://admin:test1234@127.0.0.1:5432/app_db
      RABBITMQ_URI: amqp://user:password@127.0.0.1:5672
      VALKEY_URL: redis://127.0.0.1:6379/0
      VIDIS_CLIENT_ID: ais-chat-e2e-client
      VIDIS_CLIENT_SECRET: ClientSecret-e2e
      VIDIS_ISSUER_URI: http://localhost:8080/realms/ais-chat-local
      KEYCLOAK_CLIENT_ID: ais-chat-e2e-client
      KEYCLOAK_CLIENT_SECRET: ClientSecret-e2e
      KEYCLOAK_ISSUER: http://localhost:8080/realms/ais-chat-local
      API_DATABASE_URL: postgresql://admin:test1234@127.0.0.1:5432/api_db
      API_URL: http://localhost:3002
      API_KEY: ApiKeyForAISChatApiAdminApi
      ENCRYPTION_KEY: EncryptionKeyForEncryptedApiKeysToAISChatApi
      # Auth.js secret
      AUTH_SECRET: 'yN1a0lQ77RgeEQam5DvGaddbdUDQoxswK+21FmEqBPs='
      # S3 Storage (local RustFS, started via docker-compose.local.yml)
      OTC_SECRET_ACCESS_KEY: RustFS-Admin-123456
      OTC_ACCESS_KEY_ID: rustfsadmin
      OTC_S3_HOSTNAME: http://127.0.0.1:9000
      OTC_S3_REGION: eu-de
      OTC_BUCKET_NAME: ais-chat
      # Send image attachments to the LLM as base64 since RustFS is not publicly reachable
      IMAGE_ATTACHMENT_MODE: base64
      # Disable telemetry
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      # Crawl4AI
      CRAWL4AI_API_TOKEN: ais-chat-crawl4ai-token
      # Xberg
      XBERG_URL: http://localhost:8000
      XBERG_MAX_UPLOAD_SIZE_MB: '50'
      # Bifrost
      BIFROST_BASE_URL: http://localhost:8089/openai/v1
      BIFROST_API_KEY: sk-bf-example-key
      # Log files shared between the app/container log steps and the Playwright log reporter
      APP_LOG_FILE: /tmp/ais-chat-app.log
      CONTAINER_LOG_FILE: /tmp/container-logs.log

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Starts all e2e container dependencies in the background using the same compose file as
      # local dev. Later steps only block on the specific containers they actually need, once needed.
      - name: Start e2e container dependencies (in background)
        run: docker compose -f devops/docker/docker-compose.local.yml up -d --build &

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter ais-chat-app exec playwright install chromium firefox

      - name: Wait for postgres
        run: docker compose -f devops/docker/docker-compose.local.yml up -d --wait postgres

      - name: Start ais-chat-api
        run: |
          pnpm --filter ais-chat-api dev > /tmp/ais-chat-api.log 2>&1 &
          timeout=60
          elapsed=0
          until wget -qO- http://localhost:3002/health > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "ais-chat-api did not become ready within ${timeout}s"
              exit 1
            fi
            echo "$(date) - waiting for ais-chat-api to be ready"
            sleep 1
            elapsed=$((elapsed + 1))
          done
        env:
          PORT: 3002

      - name: Wait for bifrost, mock-llm and rustfs
        run: docker compose -f devops/docker/docker-compose.local.yml up -d --wait bifrost mock-llm rustfs-init

      - name: Seed ais-chat-api database
        # db:seed will print the generated API KEY on the console
        # The output is captured in GITHUB_ENV for seeding ais-chat-app
        run: |
          pnpm --filter @ais-chat/api-database db:seed | tee /tmp/out.txt
          grep -E '^DE_[A-Z0-9_]*_API_KEY=' /tmp/out.txt >> "$GITHUB_ENV"
        env:
          BIFROST_ADMIN_URL: http://localhost:8089
          BIFROST_ADMIN_USERNAME: admin
          BIFROST_ADMIN_PASSWORD: admin
          LLM_IONOS_API_KEY: ${{ secrets.LLM_IONOS_API_KEY }}
          LLM_IONOS_BASE_URL: ${{ secrets.LLM_IONOS_BASE_URL }}
          LLM_GPT4OMINI_API_KEY: ${{ secrets.LLM_GPT4OMINI_API_KEY }}
          LLM_GPT4OMINI_BASE_URL: ${{ secrets.LLM_GPT4OMINI_BASE_URL }}
          LLM_GPT5NANO_API_KEY: ${{ secrets.LLM_GPT5NANO_API_KEY }}
          LLM_GPT5NANO_BASE_URL: ${{ secrets.LLM_GPT5NANO_BASE_URL }}
          LLM_GPT_IMAGE_API_KEY: ${{ secrets.LLM_GPT_IMAGE_API_KEY }}
          LLM_GPT_IMAGE_BASE_URL: ${{ secrets.LLM_GPT_IMAGE_BASE_URL }}
          LLM_GPT5MINI_API_KEY: ${{ secrets.LLM_GPT5MINI_API_KEY }}
          LLM_GPT5MINI_BASE_URL: ${{ secrets.LLM_GPT5MINI_BASE_URL }}
          LLM_MOCK_API_KEY: mock-api-key
          LLM_MOCK_BASE_URL: http://mock-llm:6556

      - name: Run migrations and seed database (if applicable)
        run: pnpm --filter @ais-chat/shared db:migrate && pnpm --filter @ais-chat/shared db:seed

      - name: Cache turbo build cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-

      # Build and start the app the same way as in the prod container (Next.js standalone)
      - name: Start application
        run: |
          pnpm --filter ais-chat-app build:envless
          cd apps/chat-bot
          mkdir -p .next/standalone/apps/chat-bot/.next
          cp -a .next/static .next/standalone/apps/chat-bot/.next/
          cp -a public .next/standalone/apps/chat-bot/
          cd .next/standalone
          # Prepend each log line with a UTC timestamp so the Playwright reporter can correlate them with tests.
          node ./apps/chat-bot/server.js 2>&1 \
            | gawk '{ print strftime("%Y-%m-%dT%H:%M:%SZ", systime(), 1), $0; fflush() }' \
            > "$APP_LOG_FILE" &
        env:
          # Surface all app log levels on stdout (captured in $APP_LOG_FILE).
          LOG_TO_STDOUT: 'true'
          LINKUP_API_KEY: ${{ secrets.LINKUP_API_KEY }}

      - name: Start admin application
        run: |
          pnpm --filter ais-chat-admin dev > /tmp/ais-chat-admin.log 2>&1 &
          timeout=60
          elapsed=0
          until wget -qO- http://localhost:3001/api/healthz > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "ais-chat-admin did not become ready within ${timeout}s"
              exit 1
            fi
            echo "$(date) - waiting for ais-chat-admin to be ready"
            sleep 1
            elapsed=$((elapsed + 1))
          done

      - name: Wait for valkey and keycloak
        run: |
          docker compose -f devops/docker/docker-compose.local.yml up -d --wait valkey keycloak
          timeout=120
          elapsed=0
          until wget -qO- "${VIDIS_ISSUER_URI}/.well-known/openid-configuration" > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "Keycloak did not become ready within ${timeout}s"
              exit 1
            fi
            echo "$(date) - waiting for keycloak to be ready"
            sleep 1
            elapsed=$((elapsed + 1))
          done

      # Stream container logs (with timestamps) to a file so the Playwright reporter can correlate them with tests.
      - name: Stream container logs to file
        run: docker compose -f devops/docker/docker-compose.local.yml logs --no-color --timestamps --follow > "$CONTAINER_LOG_FILE" 2>&1 &

      - name: Run E2E tests (app)
        run: pnpm --filter ais-chat-app e2e
        env:
          CI: true
          E2E_TEXT_MODEL_1: Mock LLM
          E2E_TEXT_MODEL_2: Mock LLM (2)

      - name: Run E2E tests (admin)
        run: pnpm --filter ais-chat-admin e2e
        env:
          CI: true

      - name: Run E2E tests (api)
        run: pnpm --filter ais-chat-api e2e
        env:
          CI: true
          DE_TEST_API_KEY: ${{ env.DE_TEST_API_KEY }}

      - name: Upload Playwright reports (app)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/chat-bot/playwright-report
          retention-days: 30

      - name: Upload Playwright reports (api)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-playwright-report
          path: apps/api/playwright-report
          retention-days: 30

      - name: Upload Playwright reports (admin)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: admin-playwright-report
          path: apps/admin/playwright-report
          retention-days: 30

      - name: Print ais-chat-api logs
        if: always()
        run: |
          echo "=== ais-chat-api logs ==="
          cat /tmp/ais-chat-api.log || true

      - name: Print ais-chat-app logs
        if: always()
        run: |
          echo "=== ais-chat-app logs ==="
          cat "$APP_LOG_FILE" || true

      - name: Print ais-chat-admin logs
        if: always()
        run: |
          echo "=== ais-chat-admin logs ==="
          cat /tmp/ais-chat-admin.log || true

      - name: Print container logs
        if: always()
        run: cat "$CONTAINER_LOG_FILE" || true
