name: Docker Build

on:
  workflow_run:
    workflows: ['Build'] # must match the name from `checks.yml`
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all_images:
        description: 'Build all images, ignoring turbo change detection'
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.run_id || 'docker-build-main' }}
  cancel-in-progress: false

permissions:
  artifact-metadata: write
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # Each image is built natively per platform (no QEMU emulation) and pushed by digest only.
  # The merge job below combines the platform digests into one multi-arch manifest with the tags.
  build_push_docker_images:
    name: Image ${{ matrix.image.image_name }} (${{ matrix.platform.slug }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      is_dry_run: ${{ github.event_name == 'workflow_dispatch' }}
      TURBO_TELEMETRY_DISABLED: 1
      # Triggered by workflow_run after "Build" (checks.yml) finishes, to build
      # the same commit it just validated. Bare `github.sha` would instead
      # resolve to main's current tip, which may have moved on since.
      resolved_sha: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux/amd64
            slug: amd64
            runner: ubuntu-26.04
          - name: linux/arm64
            slug: arm64
            runner: ubuntu-26.04-arm
        image: &images
          - image_name: ais-chat-api
            package_name: ais-chat-api
            dockerfile: apps/api/Dockerfile
            image_ref: ghcr.io/fwu-de/ais-chat-api
            sentry_project: ${{ vars.SENTRY_PROJECT_API }}
            server_actions_secret: ''
          - image_name: ais-chat-app
            package_name: ais-chat-app
            dockerfile: apps/chat-bot/Dockerfile
            image_ref: ghcr.io/fwu-de/ais-chat-app
            sentry_project: ${{ vars.SENTRY_PROJECT_DIALOG }}
            server_actions_secret: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_APP
          - image_name: ais-chat-admin
            package_name: ais-chat-admin
            dockerfile: apps/admin/Dockerfile
            image_ref: ghcr.io/fwu-de/ais-chat-admin
            sentry_project: ${{ vars.SENTRY_PROJECT_ADMIN }}
            server_actions_secret: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_ADMIN
          - image_name: ais-chat-calculator
            package_name: '@ais-chat/calculator-service'
            dockerfile: services/calculator/Dockerfile
            image_ref: ghcr.io/fwu-de/ais-chat-calculator
            sentry_project: ''
            server_actions_secret: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.resolved_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --filter . --frozen-lockfile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine last built commit for image
        id: last-built
        run: |
          revision=$(docker buildx imagetools inspect '${{ matrix.image.image_ref }}:latest' \
            --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)
          if [ -n "$revision" ] && [ "$revision" != "<no value>" ] && git cat-file -e "${revision}^{commit}" 2>/dev/null; then
            echo "sha=$revision" >> "$GITHUB_OUTPUT"
          else
            echo "sha=HEAD^" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if shared build pipeline changed
        id: pipeline-changed
        # These files aren't tracked by turbo (outside any workspace package),
        # so a change here must force a rebuild of every image regardless of
        # turbo query affected's per-package result.
        run: |
          if git diff --quiet "${{ steps.last-built.outputs.sha }}" -- .github/workflows/docker.yml .dockerignore; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if build is needed
        id: turbo-ignore
        run: |
          if [ "${{ inputs.build_all_images }}" = "true" ] || [ "${{ steps.pipeline-changed.outputs.changed }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif pnpm exec turbo query affected --packages "${{ matrix.image.package_name }}" --base "${{ steps.last-built.outputs.sha }}" --exit-code; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ${{ env.is_dry_run == 'true' && 'Build (no push)' || 'Build and push' }}
        if: steps.turbo-ignore.outputs.skip == 'false'
        id: docker-build
        uses: docker/build-push-action@v7
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_PROJECT: ${{ matrix.image.sentry_project }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ matrix.image.server_actions_secret != '' && secrets[matrix.image.server_actions_secret] || '' }}
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          secret-envs: |
            SENTRY_AUTH_TOKEN=SENTRY_AUTH_TOKEN
            SENTRY_ORG=SENTRY_ORG
            SENTRY_PROJECT=SENTRY_PROJECT
            SENTRY_URL=SENTRY_URL
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
          build-args: |
            CI=${CI}
            APP_VERSION=${{ env.resolved_sha }}
          labels: |
            org.opencontainers.image.revision=${{ env.resolved_sha }}
          outputs: type=image,name=${{ matrix.image.image_ref }},push-by-digest=true,name-canonical=true,push=${{ env.is_dry_run != 'true' }}
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image.image_name }}-${{ matrix.platform.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.image_name }}-${{ matrix.platform.slug }}

      - name: Export digest
        if: steps.turbo-ignore.outputs.skip == 'false' && env.is_dry_run != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.docker-build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.turbo-ignore.outputs.skip == 'false' && env.is_dry_run != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.image_name }}-${{ matrix.platform.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge_docker_manifests:
    name: Manifest ${{ matrix.image.image_name }}
    needs: build_push_docker_images
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Runs even if another image failed; an image is only tagged when both platforms were built
    if: >
      !cancelled() &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    env:
      resolved_sha: ${{ github.event.workflow_run.head_sha }}

    strategy:
      fail-fast: false
      matrix:
        image: *images

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image.image_name }}-*
          merge-multiple: true

      - name: Check digests
        id: digests
        run: |
          count=$(find "${{ runner.temp }}/digests" -type f 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No build needed for ${{ matrix.image.image_name }}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$count" -ne 2 ]; then
            echo "::error::Expected 2 platform digests for ${{ matrix.image.image_name }}, found $count."
            exit 1
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        if: steps.digests.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.digests.outputs.skip == 'false'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        if: steps.digests.outputs.skip == 'false'
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="${{ matrix.image.image_ref }}"
          sources=()
          for digest in *; do sources+=("$image@sha256:$digest"); done
          docker buildx imagetools create \
            --tag "$image:latest" \
            --tag "$image:${{ env.resolved_sha }}" \
            "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$image:${{ env.resolved_sha }}" --format '{{ json .Manifest }}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        if: steps.digests.outputs.skip == 'false'
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ matrix.image.image_ref }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
