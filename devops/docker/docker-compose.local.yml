name: ais-chat

services:
  postgres:
    # Use the same postgres version as in production
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: test1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d app_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  valkey:
    image: ghcr.io/valkey-io/valkey:9.1.2-alpine
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3-0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      CLIENT_NAME: ${VIDIS_CLIENT_ID:-ais-chat-dev-client}
      CLIENT_SECRET: ${VIDIS_CLIENT_SECRET:-ClientSecret}
    entrypoint: /opt/keycloak/data/import/entrypoint.sh
    # Stop grace period is set to 2 minutes to allow Keycloak to export the realm and users on shutdown
    stop_grace_period: 2m
    volumes:
      - keycloak_data:/opt/keycloak/data/h2
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - '8080:8080'
    restart: unless-stopped
    depends_on:
      fix-keycloak-volume-ownership:
        condition: service_completed_successfully

  # keycloak runs with uid 1000, but docker creates volumes with root as owner; use a one-shot container to fix the permission
  fix-keycloak-volume-ownership:
    image: alpine:3.24.1
    restart: no
    entrypoint: /bin/sh -c "chown 1000 /keycloak"
    volumes:
      - keycloak_data:/keycloak

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_DEFAULT_USER: user
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  crawl4ai:
    image: unclecode/crawl4ai:0.9.3

    environment:
      CRAWL4AI_API_TOKEN: ais-chat-crawl4ai-token
    ports:
      - '11235:11235'
    deploy:
      resources:
        limits:
          memory: '2gb'
        reservations:
          memory: '1gb'
    shm_size: '2gb'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11235/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  xberg:
    image: ghcr.io/xberg-io/xberg:1.0.14-core
    environment:
      XBERG_MAX_UPLOAD_SIZE_MB: '50'
    ports:
      - '8000:8000'
    volumes:
      - xberg_cache:/app/.xberg
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  mock-llm:
    build:
      context: ./mock-llm
    restart: unless-stopped
    ports:
      - '6556:6556'

  # RustFS - S3-compatible object storage
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: RustFS-Admin-123456
      RUSTFS_VOLUMES: /data
      RUSTFS_CORS_ALLOWED_ORIGINS: 'http://localhost:3000'
    volumes:
      - rustfs_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/health']
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  # One-shot init container to create the S3 bucket used by ais-chat on rustfs
  rustfs-init:
    image: alpine:3.24.1
    restart: no
    entrypoint: /bin/sh -c "apk add --no-cache s3cmd && s3cmd --access_key=rustfsadmin --secret_key=RustFS-Admin-123456 --host=rustfs:9000 --host-bucket='rustfs:9000/%(bucket)' --region=eu-de --no-ssl --no-check-certificate mb s3://ais-chat"
    depends_on:
      rustfs:
        condition: service_healthy

  bifrost:
    image: ghcr.io/maximhq/bifrost:v2.0.0
    restart: unless-stopped
    environment:
      BIFROST_ADMIN_USERNAME: admin
      BIFROST_ADMIN_PASSWORD: admin
      BIFROST_API_KEY: sk-bf-example-key
      BIFROST_ENV_LABEL: local
    ports:
      - '8089:8080'
    volumes:
      - ./bifrost/config.json:/app/data/config.json:ro
      - bifrost_data:/app/data
    # bifrost is reliably up within ~1s; poll faster than the image's default 30s interval.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  calculator:
    build:
      context: ../..
      dockerfile: services/calculator/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:8080'
    expose:
      - '8080'
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bifrost_data:
  keycloak_data:
  postgres_data:
  valkey_data:
  xberg_cache:
  rustfs_data:
