name: ais-chat-local

services:
  # Keycloak for authentication (PRIMARY NETWORK HOST)
  # Containers share this network namespace via network_mode: "service:keycloak"
  # This is required to access keycloak using the same URL from within the container and the browser
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3-0
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      CLIENT_NAME: ais-chat-dev-client
      CLIENT_SECRET: ClientSecret
    entrypoint: /opt/keycloak/data/import/entrypoint.sh
    # Stop grace period is set to 2 minutes to allow Keycloak to export the realm and users on shutdown
    stop_grace_period: 2m
    volumes:
      - keycloak_data:/opt/keycloak/data/h2
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - '3000:3000' # ais-chat-app
      - '3001:3001' # ais-chat-admin
      - '3002:3002' # ais-chat-api
      - '8080:8080' # keycloak
    depends_on:
      fix-keycloak-volume-ownership:
        condition: service_completed_successfully
    # Application containers use keycloak's network namespace; this gives them
    # access to calculator without giving calculator an egress-capable network.
    networks:
      - default
      - calculator-isolated

  # Fix keycloak volume permissions (runs with uid 1000)
  fix-keycloak-volume-ownership:
    image: alpine:3.24.1
    restart: no
    entrypoint: /bin/sh -c "chown 1000 /keycloak"
    volumes:
      - keycloak_data:/keycloak

  # PostgreSQL database with pgvector extension
  # Creates both app_db (default) and api_db
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: test1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d app_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Valkey (Redis-compatible) for session storage
  valkey:
    image: ghcr.io/valkey-io/valkey:9.1.2-alpine
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ for async messaging and reporting
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  # Crawl4AI for web scraping capabilities
  crawl4ai:
    image: unclecode/crawl4ai:0.9.3
    environment:
      CRAWL4AI_API_TOKEN: ais-chat-crawl4ai-token
    restart: unless-stopped
    ports:
      - '11235:11235'
    deploy:
      resources:
        limits:
          memory: '2gb'
        reservations:
          memory: '1gb'
    shm_size: '2gb'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:11235/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Xberg text extraction service
  xberg:
    image: ghcr.io/xberg-io/xberg:1.0.14-core
    restart: unless-stopped
    environment:
      XBERG_MAX_UPLOAD_SIZE_MB: '50'
    ports:
      - '8000:8000'
    volumes:
      - xberg_cache:/app/.xberg
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # RustFS - S3-compatible object storage
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: RustFS-Admin-123456
      RUSTFS_VOLUMES: /data
      RUSTFS_CORS_ALLOWED_ORIGINS: 'http://localhost:3000'
    volumes:
      - rustfs_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/health']
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  bifrost:
    image: ghcr.io/maximhq/bifrost:v2.0.0
    restart: unless-stopped
    environment:
      BIFROST_ADMIN_USERNAME: admin
      BIFROST_ADMIN_PASSWORD: admin
      BIFROST_API_KEY: sk-bf-example-key
    volumes:
      - ./bifrost/config.json:/app/data/config.json:ro
      - bifrost_data:/app/data
    ports:
      - '8089:8080'

  # Sandboxed arithmetic service backed by libqalculate.
  calculator:
    build:
      context: ../..
      dockerfile: services/calculator/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:8080'
    expose:
      - '8080'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - calculator-isolated
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # AIS.chat API - OpenAI compatible API service
  ais-chat-api:
    image: ghcr.io/fwu-de/ais-chat-api:latest
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://admin:test1234@postgres:5432/api_db

      # API Configuration
      API_NAME: ais-chat
      API_KEY: ais-chat-api_api-key
      PORT: 3002

      # Logging
      LOG_LEVEL: info

      # LLM Provider Credentials (placeholders - configure via admin UI after setup)
      LLM_IONOS_API_KEY: API_KEY_PLACEHOLDER
      LLM_IONOS_BASE_URL: PLACEHOLDER_BASE_URL
      LLM_GPT4OMINI_API_KEY: API_KEY_PLACEHOLDER
      LLM_GPT4OMINI_BASE_URL: PLACEHOLDER_BASE_URL
      LLM_GPT5NANO_API_KEY: API_KEY_PLACEHOLDER
      LLM_GPT5NANO_BASE_URL: PLACEHOLDER_BASE_URL
      LLM_GPT_IMAGE_API_KEY: API_KEY_PLACEHOLDER
      LLM_GPT_IMAGE_BASE_URL: PLACEHOLDER_BASE_URL

      # Bifrost LLM proxy
      BIFROST_BASE_URL: http://bifrost:8080/openai/v1
      BIFROST_API_KEY: sk-bf-example-key
    network_mode: service:keycloak
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      bifrost:
        condition: service_started

  # AIS.chat App - Main user-facing application
  ais-chat-app:
    image: ghcr.io/fwu-de/ais-chat-app:latest
    restart: unless-stopped
    environment:
      # Application
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_KEY: ais-chat-app_api-key
      NODE_ENV: development

      # Authentication
      # IMPORTANT: Change AUTH_SECRET in production! Generate with: openssl rand -base64 32
      AUTH_SECRET: ais-chat-default-secret-please-change-in-production-use-openssl-rand-base64-32

      # Keycloak
      VIDIS_CLIENT_ID: ais-chat-dev-client
      VIDIS_CLIENT_SECRET: ClientSecret
      VIDIS_BASE_URI: http://localhost:8080/realms/ais-chat-local
      VIDIS_ISSUER_URI: http://localhost:8080/realms/ais-chat-local

      # Databases
      DATABASE_URL: postgresql://admin:test1234@postgres:5432/app_db
      API_DATABASE_URL: postgresql://admin:test1234@postgres:5432/api_db
      DB_CACHE_TTL_SECONDS: 300

      # Valkey (Redis) for sessions
      VALKEY_URL: redis://valkey:6379/0

      # RabbitMQ for reporting
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672

      # AIS.chat API connection
      API_URL: http://localhost:3002

      # Crawl4AI
      CRAWL4AI_URL: http://crawl4ai:11235
      CRAWL4AI_API_TOKEN: ais-chat-crawl4ai-token

      # Xberg text extraction
      XBERG_URL: http://xberg:8000

      # Calculator arithmetic service
      CALCULATOR_URL: http://calculator:8080

      # Bifrost LLM proxy
      BIFROST_BASE_URL: http://bifrost:8080/openai/v1
      BIFROST_API_KEY: sk-bf-example-key

      # S3 Object Storage for file uploads and image generation
      # RustFS here is internal-only (not publicly reachable), so IMAGE_ATTACHMENT_MODE=base64 is required
      # for the LLM to access uploaded images.
      OTC_SECRET_ACCESS_KEY: RustFS-Admin-123456
      OTC_ACCESS_KEY_ID: rustfsadmin
      OTC_S3_HOSTNAME: http://rustfs:9000
      OTC_S3_REGION: eu-de
      OTC_BUCKET_NAME: ais-chat
      IMAGE_ATTACHMENT_MODE: base64

      # Encryption key for sensitive data (IMPORTANT: Change in production!)
      ENCRYPTION_KEY: default-encryption-key-change-in-production

      # Google Vertex AI (optional - for image generation)
      GOOGLE_APPLICATION_CREDENTIALS: ''

      # Logging
      NEXT_PUBLIC_SENTRY_LOG_LEVEL: debug
    network_mode: service:keycloak
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
      xberg:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      keycloak:
        condition: service_started
      bifrost:
        condition: service_started
      calculator:
        condition: service_healthy

  # AIS.chat Admin - Administration interface
  ais-chat-admin:
    image: ghcr.io/fwu-de/ais-chat-admin:latest
    restart: unless-stopped
    environment:
      # Application
      HOSTNAME: 0.0.0.0
      PORT: 3001

      # Authentication
      # IMPORTANT: Change AUTH_SECRET in production! Generate with: openssl rand -base64 32
      AUTH_SECRET: ais-chat-default-secret-please-change-in-production-use-openssl-rand-base64-32

      # Keycloak
      KEYCLOAK_CLIENT_ID: ais-chat-dev-client
      KEYCLOAK_CLIENT_SECRET: ClientSecret
      KEYCLOAK_ISSUER: http://localhost:8080/realms/ais-chat-local

      # AIS.chat app
      DATABASE_URL: postgresql://admin:test1234@postgres:5432/app_db
      ENCRYPTION_KEY: default-encryption-key-change-in-production

      # AIS.chat api
      API_DATABASE_URL: postgresql://admin:test1234@postgres:5432/api_db
      API_KEY: ais-chat-api_api-key
      API_URL: http://localhost:3002
      # Note: DB_CACHE_TTL_SECONDS should NOT be set in admin app

      # Bifrost LLM proxy
      BIFROST_ADMIN_URL: http://bifrost:8080
      BIFROST_ADMIN_USERNAME: admin
      BIFROST_ADMIN_PASSWORD: admin

      # Monitoring (optional, leave empty to disable)
      NEXT_PUBLIC_SENTRY_LOG_LEVEL: info
    network_mode: service:keycloak
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      bifrost:
        condition: service_started

  # Initialization container
  ais-chat-init:
    image: alpine:3.24.1
    restart: no
    environment:
      # Database URLs for both databases
      DATABASE_URL: postgresql://admin:test1234@postgres:5432/app_db
      API_DATABASE_URL: postgresql://admin:test1234@postgres:5432/api_db

      # LLM Provider Credentials (placeholders for seeding)
      LLM_IONOS_API_KEY: API_KEY_PLACEHOLDER
      LLM_IONOS_BASE_URL: PLACEHOLDER_BASE_URL
      LLM_GPT4OMINI_API_KEY: API_KEY_PLACEHOLDER
      LLM_GPT4OMINI_BASE_URL: PLACEHOLDER_BASE_URL
      LLM_GPT5NANO_API_KEY: API_KEY_PLACEHOLDER
      LLM_GPT5NANO_BASE_URL: PLACEHOLDER_BASE_URL
      LLM_GPT5IMAGE_API_KEY: API_KEY_PLACEHOLDER
      LLM_GPT5IMAGE_BASE_URL: PLACEHOLDER_BASE_URL
    command: >
      sh -c "
        echo '=== Starting AIS.chat Initialization ==='

        echo '=== Installing s3cmd ==='
        apk add --no-cache s3cmd

        echo '=== Creating S3 bucket: ais-chat ==='
        s3cmd --access_key=rustfsadmin --secret_key=RustFS-Admin-123456 --host=rustfs:9000 --host-bucket='rustfs:9000/%(bucket)' --region=eu-de --no-ssl --no-check-certificate mb s3://ais-chat

        echo '=== Seeding api_db ==='
        apk add --no-cache postgresql-client
        PGPASSWORD=test1234 psql -h postgres -U admin -d api_db -c \"INSERT INTO organization (name) SELECT 'LOCAL' WHERE NOT EXISTS (SELECT 1 FROM organization);\"
        # Remaining seeding is done manually via ais-chat-admin interface

        echo '=== AIS.chat initialization completed successfully ==='
      "
    network_mode: service:keycloak
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      keycloak:
        condition: service_started
      ais-chat-api:
        condition: service_healthy
      ais-chat-app:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
  keycloak_data:
  bifrost_data:
  rustfs_data:
  xberg_cache:

networks:
  calculator-isolated:
    internal: true
