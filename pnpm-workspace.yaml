packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
engineStrict: true
allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@sentry/node-cpu-profiler': false
  '@swc/core': true
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
overrides:
  glob@<11.1.0: 11.1.0
  minimatch@>=9.0.0 <9.0.7: 9.0.7
  protobufjs@>=8.0.0 <8.0.2: 8.0.2
  '@xmldom/xmldom@<0.8.13': 0.8.13
  fast-uri@<3.1.9: 3.1.9
  undici@<7.30.1: 7.30.1
  postcss@<8.5.25: 8.5.25
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  katex@<0.19.1: 0.19.1
  adm-zip@<0.6.1: 0.6.1
  '@modelcontextprotocol/sdk@<1.32.0': 1.32.0
